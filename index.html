<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">Team Project – IT</p>
        <h1>Task Manager</h1>
        <p class="subtitle">A simple Supabase-powered task tracker.</p>
      </div>
      <div class="student-card">
        <span class="label">Student ID</span>
        <strong id="student-id">72564</strong>
      </div>
    </header>

    <section class="panel">
      <h2 id="form-title">Add Task</h2>
      <form id="task-form">
        <input type="hidden" id="task-id" value="" />
        <label for="task-title">Task title</label>
        <input id="task-title" type="text" required maxlength="200" placeholder="Enter task title" />

        <label for="task-description">Task description</label>
        <textarea id="task-description" rows="4" placeholder="Enter optional task description"></textarea>

        <div class="actions-row">
          <button id="task-submit" type="submit">Add Task</button>
          <button id="task-cancel" type="button" class="secondary hidden">Cancel Edit</button>
        </div>
      </form>
      <p id="status-message" class="status" aria-live="polite"></p>
    </section>

    <section class="panel">
      <div class="section-heading">
        <h2>Tasks</h2>
        <button id="refresh-tasks" type="button" class="secondary">Refresh</button>
      </div>
      <div id="task-list" class="task-list" aria-live="polite"></div>
    </section>

    <footer class="footer">
      <a id="contribution-link" href="contribution.html">Go to Team Contribution</a>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
